name: Offline regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QQ_MAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run application tests
        run: python -m unittest discover -s tests -q
      - name: Run preserved lesson tests
        run: python -m unittest discover -s lessons -q

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare empty local configuration
        run: cp .env.example .env
      - name: Build and start backend and UI
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify service, UI, APK and restart persistence
        run: python3 .github/scripts/container_smoke.py
      - name: Show container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Remove this runner's temporary containers and volume
        if: always()
        run: docker compose down --volumes
